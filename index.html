<script>
const FLOW_URL = 'https://defaultce0dabd7b4934b72a5a7f7bc6a276b.67.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f9be50b35f1343e7adf20a15d7ce4a4d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=otBa8NNkTMTStvc562EBgT_M6CeAs3SMMapLEP8Qci8';

function showStatus(msg, bg, color, border) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.style.background = bg;
  el.style.color = color;
  el.style.border = '1px solid ' + border;
  el.textContent = msg;
}

async function solicitarEstoque() {
  const btn = document.getElementById('btnSolicitar');
  btn.disabled = true;
  btn.style.opacity = '0.5';
  btn.style.cursor = 'not-allowed';
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#080807" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Gerando relatório...';
  showStatus('Aguarde — consultando a API e gerando o relatório...', '#1a1f0a', '#a8c46a', '#3a4a20');

  try {
    const res = await fetch(FLOW_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });

    if (res.status === 202 || res.ok) {
      btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#080807" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Solicitação enviada — confira seu e-mail';
      btn.style.opacity = '1';
      showStatus('✓ Relatório enviado por e-mail — verifique sua caixa de entrada em instantes.', '#1a1f0a', '#F2E40A', '#4a5e10');

      btn.innerHTML = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#080807" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg> Solicitar relatório por e-mail';
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
      btn.disabled = false;
      showStatus('Erro ao gerar relatório (status ' + res.status + '). Tente novamente ou contate tecnologia@fieldasset.com.br.', '#1f0a0a', '#e88080', '#4a2020');
    }
  } catch (err) {
    btn.innerHTML = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#080807" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg> Solicitar relatório por e-mail';
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
    btn.disabled = false;
    showStatus('Erro de conexão. Tente novamente.', '#1f0a0a', '#e88080', '#4a2020');
  }
}
</script>
